
<svg width="640" height="720" viewBox="0 0 640 720" fill="none" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Inspector Container -->
  <rect width="640" height="720" fill="#0f172a"/>
  
  <!-- Inspector Top Header / Tab -->
  <rect x="0" y="0" width="640" height="48" fill="#020617" opacity="0.8"/>
  <rect x="16" y="8" width="120" height="32" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4"/>
  <text x="76" y="28" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Component</text>
  <line x1="0" y1="48" x2="640" y2="48" stroke="#1e293b"/>

  <!-- Show When Section Header -->
  <g transform="translate(24, 64)">
    <circle cx="10" cy="12" r="8" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M10 6L11.5 9.5L15 11L11.5 12.5L10 16L8.5 12.5L5 11L8.5 9.5L10 6Z" fill="#fbbf24"/>
    <text x="26" y="16" fill="#f1f5f9" font-size="13" font-weight="bold" letter-spacing="0.05em">SHOW WHEN (1)</text>

    <!-- + Condition Rule Button -->
    <rect x="440" y="-4" width="150" height="32" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="515" y="16" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">+ Condition Rule</text>
  </g>

  <text x="24" y="112" fill="#94a3b8" font-size="11">Display trigger conditions for this notification card.</text>

  <!-- Rule Form Card -->
  <rect x="24" y="128" width="592" height="568" rx="12" fill="#1e293b" fill-opacity="0.95" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Form Header -->
  <rect x="24" y="128" width="592" height="42" rx="12" fill="#1e293b"/>
  <text x="44" y="154" fill="#38bdf8" font-size="13" font-weight="bold">Edit Condition Rule</text>
  <text x="480" y="154" fill="#94a3b8" font-size="11" font-family="monospace">Condition Rule Editor</text>
  <line x1="24" y1="170" x2="616" y2="170" stroke="#334155"/>

  <!-- Root Group Box (Depth 1) -->
  <rect x="40" y="184" width="560" height="294" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155"/>

  <!-- Root Group Header -->
  <text x="52" y="206" fill="#94a3b8" font-size="10" font-weight="bold" font-family="monospace">RULE GROUP</text>
  
  <!-- Match ALL / Match ANY Segmented Control -->
  <rect x="130" y="192" width="200" height="22" rx="6" fill="#020617" stroke="#1e293b"/>
  <rect x="131" y="193" width="98" height="20" rx="5" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="180" y="207" fill="#7dd3fc" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Match ALL (AND)</text>
  <text x="280" y="207" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Match ANY (OR)</text>

  <!-- Add Condition / Add Group Buttons -->
  <rect x="430" y="192" width="76" height="22" rx="5" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="468" y="207" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">+ Condition</text>
  <rect x="512" y="192" width="58" height="22" rx="5" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.3"/>
  <text x="541" y="207" fill="#818cf8" font-size="10" font-weight="bold" text-anchor="middle">+ Group</text>
  <line x1="40" y1="222" x2="600" y2="222" stroke="#1e293b"/>

  <!-- Condition 1: Speed Increase Attempted = true -->
  <g transform="translate(52, 232)">
    <rect width="536" height="52" rx="6" fill="#020617" fill-opacity="0.8" stroke="#1e293b"/>
    <text x="10" y="16" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="bold">CONDITION #1</text>
    
    <!-- Field Dropdown -->
    <rect x="10" y="22" width="220" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="18" y="38" fill="#f8fafc" font-size="11">Speed Increase Attempted</text>

    <!-- Condition Dropdown -->
    <rect x="238" y="22" width="90" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="248" y="38" fill="#f8fafc" font-size="11">=</text>

    <!-- Value Dropdown -->
    <rect x="336" y="22" width="180" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="346" y="38" fill="#f8fafc" font-size="11">true</text>
  </g>

  <!-- Logic connector AND badge -->
  <g transform="translate(52, 292)">
    <rect x="0" y="0" width="34" height="16" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="17" y="12" fill="#38bdf8" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">AND</text>
    <line x1="40" y1="8" x2="536" y2="8" stroke="#1e293b"/>
  </g>

  <!-- Nested Child Group (Depth 2, OR Logic) -->
  <g transform="translate(52, 314)">
    <rect width="536" height="152" rx="6" fill="#020617" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="10" y="18" fill="#94a3b8" font-size="9" font-weight="bold" font-family="monospace">NESTED GROUP (DEPTH 2)</text>

    <!-- Logic Switch: Match ANY (OR) active -->
    <rect x="140" y="6" width="180" height="18" rx="4" fill="#020617" stroke="#1e293b"/>
    <text x="185" y="19" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Match ALL (AND)</text>
    <rect x="230" y="7" width="88" height="16" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="274" y="19" fill="#fcd34d" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">Match ANY (OR)</text>
    <line x1="0" y1="28" x2="536" y2="28" stroke="#1e293b"/>

    <!-- Condition 2.1: Gear = P -->
    <g transform="translate(10, 36)">
      <rect width="516" height="46" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="8" y="13" fill="#94a3b8" font-size="8" font-family="monospace">CONDITION #1</text>
      <rect x="8" y="18" width="200" height="22" rx="4" fill="#020617" stroke="#334155"/>
      <text x="16" y="33" fill="#f8fafc" font-size="11">Gear (P/R/N/D)</text>
      <rect x="216" y="18" width="80" height="22" rx="4" fill="#020617" stroke="#334155"/>
      <text x="224" y="33" fill="#f8fafc" font-size="11">=</text>
      <rect x="304" y="18" width="190" height="22" rx="4" fill="#020617" stroke="#334155"/>
      <text x="312" y="33" fill="#f8fafc" font-size="11">P</text>
    </g>

    <!-- OR connector line -->
    <rect x="10" y="86" width="26" height="14" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="23" y="97" fill="#fbbf24" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">OR</text>
    <line x1="42" y1="93" x2="526" y2="93" stroke="#1e293b"/>

    <!-- Condition 2.2: Gear = N -->
    <g transform="translate(10, 102)">
      <rect width="516" height="44" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="8" y="12" fill="#94a3b8" font-size="8" font-family="monospace">CONDITION #2</text>
      <rect x="8" y="17" width="200" height="22" rx="4" fill="#020617" stroke="#334155"/>
      <text x="16" y="32" fill="#f8fafc" font-size="11">Gear (P/R/N/D)</text>
      <rect x="216" y="17" width="80" height="22" rx="4" fill="#020617" stroke="#334155"/>
      <text x="224" y="32" fill="#f8fafc" font-size="11">=</text>
      <rect x="304" y="17" width="190" height="22" rx="4" fill="#020617" stroke="#334155"/>
      <text x="312" y="32" fill="#f8fafc" font-size="11">N</text>
    </g>
  </g>

  <!-- Live Summary Box -->
  <g transform="translate(40, 488)">
    <rect width="560" height="48" rx="8" fill="#020617" fill-opacity="0.9" stroke="#1e293b"/>
    <text x="12" y="18" fill="#94a3b8" font-size="10" font-weight="bold" font-family="monospace">SUMMARY</text>
    <text x="12" y="36" fill="#7dd3fc" font-size="11" font-weight="bold" font-family="monospace">Show when Speed Increase Attempted is true AND (Gear is P OR Gear is N)</text>
  </g>

  <!-- Event-Triggered Helper Text -->
  <g transform="translate(40, 544)">
    <rect width="560" height="42" rx="8" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3"/>
    <circle cx="20" cy="21" r="7" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">i</text>
    <text x="34" y="21" fill="#fef3c7" font-size="10.5">
      <tspan font-weight="bold">Event-Triggered: </tspan>
      <tspan fill="#fde68a">Stays visible for the global duration (6s), followed by a 15-second cooldown.</tspan>
    </text>
  </g>

  <!-- Advanced Disclosure -->
  <g transform="translate(40, 598)">
    <path d="M6 4L12 10L6 16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="20" y="12" fill="#94a3b8" font-size="11" font-weight="bold">Advanced Target Properties</text>
    <text x="200" y="12" fill="#64748b" font-size="10">(Defaults to visible = true)</text>
  </g>

  <!-- Save & Cancel Buttons -->
  <g transform="translate(40, 634)">
    <rect x="0" y="0" width="450" height="34" rx="6" fill="#0ea5e9"/>
    <text x="225" y="22" fill="#020617" font-size="12" font-weight="bold" text-anchor="middle">Save Changes</text>
    <rect x="460" y="0" width="100" height="34" rx="6" fill="#334155"/>
    <text x="510" y="22" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Cancel</text>
  </g>
</svg>
